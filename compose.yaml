name: personal-workspace
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hex password in .env}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workspace -d workspace"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://workspace:${POSTGRES_PASSWORD}@db:5432/workspace
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: ./web
    restart: unless-stopped
    ports: ["127.0.0.1:${LOCAL_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    networks: [private,edge]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: {condition: service_healthy}
volumes:
  database:
  caddy_data:
  caddy_config:
networks:
  private: {internal: true}
  edge:
